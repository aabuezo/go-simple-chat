<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · Simple Chat</title>
    <script>const savedTheme = localStorage.getItem("chat-theme"); if (savedTheme === "dark" || (!savedTheme && window.matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: "class", theme: { extend: { colors: { brand: { 100: "#ffedd5", 500: "#f97316", 600: "#ea580c", 700: "#c2410c" } } } } };</script>
</head>
<body class="h-full bg-slate-100 text-slate-800 antialiased transition-colors dark:bg-zinc-950 dark:text-zinc-100">
    <div class="relative min-h-full overflow-hidden bg-[radial-gradient(circle_at_top_right,_rgba(249,115,22,.14),_transparent_32rem)]">
        <header class="border-b border-slate-200/80 bg-white/80 backdrop-blur-xl dark:border-zinc-800 dark:bg-zinc-950/80">
            <div class="mx-auto flex w-[min(1180px,92%)] items-center justify-between py-5"><a href="/" class="flex items-center gap-3"><span class="grid h-10 w-10 place-items-center rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 text-lg font-bold text-white shadow-lg shadow-orange-500/20">✦</span><span class="text-xl font-semibold tracking-tight text-slate-900 dark:text-white">Simple<span class="text-brand-600">Chat</span></span></a><button id="theme-toggle" type="button" aria-label="Toggle color mode" class="grid h-10 w-10 place-items-center rounded-xl border border-slate-200 bg-white text-slate-600 transition hover:border-brand-300 hover:text-brand-600 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-300 dark:hover:border-brand-500 dark:hover:text-brand-400"><span id="theme-icon">☾</span></button></div>
        </header>
        <main class="mx-auto flex min-h-[calc(100vh-89px)] w-[min(1180px,92%)] items-center justify-center py-12"><div class="grid w-full max-w-5xl overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-[0_24px_70px_rgba(15,23,42,.12)] dark:border-zinc-800 dark:bg-zinc-900 lg:grid-cols-2"><div class="hidden flex-col justify-between bg-gradient-to-br from-brand-600 to-orange-400 p-10 text-white lg:flex"><div><p class="mb-8 text-sm font-semibold uppercase tracking-[.2em] text-orange-100">Your space</p><h1 class="max-w-sm text-5xl font-bold leading-tight tracking-tight">Conversations that feel closer.</h1><p class="mt-6 max-w-sm text-orange-50">A simple place to connect with the people who matter.</p></div><div class="text-6xl opacity-30">✦</div></div><div class="p-7 sm:p-12"><div class="mb-10 lg:hidden"><p class="mb-2 text-sm font-semibold uppercase tracking-[.2em] text-brand-600">Welcome back</p><h1 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white">Sign in to chat</h1></div><form method="post" class="mx-auto max-w-md"><p class="mb-2 hidden text-sm font-semibold uppercase tracking-[.2em] text-brand-600 lg:block">Welcome back</p><h2 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white lg:text-4xl">Sign in to chat</h2><p class="mt-3 text-sm leading-6 text-slate-500 dark:text-zinc-400">Enter your details and pick up where you left off.</p><div class="mt-8 space-y-5"><label class="block"><span class="mb-2 block text-sm font-medium text-slate-700 dark:text-zinc-300">Username</span><input type="text" name="username" id="username" required autocomplete="username" placeholder="Your username" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none ring-brand-500 transition placeholder:text-slate-400 focus:bg-white focus:ring-2 dark:border-zinc-700 dark:bg-zinc-950 dark:text-white dark:placeholder:text-zinc-500 dark:focus:bg-zinc-900" /></label><label class="block"><span class="mb-2 block text-sm font-medium text-slate-700 dark:text-zinc-300">Password</span><input type="password" name="password" id="password" required autocomplete="current-password" placeholder="Your password" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none ring-brand-500 transition placeholder:text-slate-400 focus:bg-white focus:ring-2 dark:border-zinc-700 dark:bg-zinc-950 dark:text-white dark:placeholder:text-zinc-500 dark:focus:bg-zinc-900" /></label><button type="submit" class="w-full rounded-xl bg-gradient-to-r from-brand-600 to-orange-500 px-5 py-3.5 text-sm font-semibold text-white shadow-lg shadow-orange-500/20 transition hover:-translate-y-0.5 hover:shadow-orange-500/30 active:translate-y-0">Enter the room <span class="ml-1">→</span></button></div></form></div></div></main>
    </div>
    <script>const themeIcon = document.getElementById("theme-icon"); function updateThemeIcon() { themeIcon.textContent = document.documentElement.classList.contains("dark") ? "☀" : "☾"; } updateThemeIcon(); document.getElementById("theme-toggle").addEventListener("click", () => { const dark = document.documentElement.classList.toggle("dark"); localStorage.setItem("chat-theme", dark ? "dark" : "light"); updateThemeIcon(); });</script>
</body>
</html>
