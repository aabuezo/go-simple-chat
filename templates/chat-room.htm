<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Chat</title>
    <script>
        const savedTheme = localStorage.getItem("chat-theme");
        if (savedTheme === "dark" || (!savedTheme && window.matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: "class", theme: { extend: { colors: { brand: { 50: "#fff7ed", 100: "#ffedd5", 500: "#f97316", 600: "#ea580c", 700: "#c2410c" } }, boxShadow: { soft: "0 24px 70px rgba(15, 23, 42, .12)" } } } };</script>
</head>
<body class="h-full bg-slate-100 text-slate-800 antialiased transition-colors dark:bg-slate-950 dark:text-slate-100">
    <div class="min-h-full bg-[radial-gradient(circle_at_top_right,_rgba(249,115,22,.13),_transparent_32rem)]">
        <header class="border-b border-slate-200/80 bg-white/80 backdrop-blur-xl dark:border-slate-800 dark:bg-slate-950/80">
            <div class="mx-auto flex w-[min(1180px,92%)] items-center justify-between py-5">
                <a href="/room" class="flex items-center gap-3"><span class="grid h-10 w-10 place-items-center rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 text-lg font-bold text-white shadow-lg shadow-orange-500/20">✦</span><span class="text-xl font-semibold tracking-tight text-slate-900 dark:text-white">Simple<span class="text-brand-600">Chat</span></span></a>
                <div class="flex items-center gap-2"><button id="theme-toggle" type="button" aria-label="Toggle color mode" class="grid h-10 w-10 place-items-center rounded-xl border border-slate-200 bg-white text-slate-600 transition hover:border-brand-300 hover:text-brand-600 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300 dark:hover:border-brand-500 dark:hover:text-brand-400"><span id="theme-icon">☾</span></button><a href="/logout" class="rounded-xl px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-brand-600 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-brand-400">Log out</a></div>
            </div>
        </header>
        <main class="mx-auto w-[min(1180px,92%)] py-8 sm:py-12">
            <div class="mb-6 flex items-end justify-between gap-4"><div><p class="mb-2 text-sm font-semibold uppercase tracking-[.2em] text-brand-600 dark:text-brand-500">Your space</p><h1 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white sm:text-4xl">Good to see you, {{.}}</h1><p class="mt-2 text-slate-500 dark:text-slate-400">Keep the conversation going.</p></div><div id="connection" class="hidden items-center gap-2 rounded-full border border-emerald-200 bg-emerald-50 px-3 py-1.5 text-xs font-medium text-emerald-700 dark:border-emerald-900/60 dark:bg-emerald-950/40 dark:text-emerald-400 sm:flex"><span class="h-2 w-2 rounded-full bg-emerald-500"></span> Connected</div></div>
            <div class="grid min-h-[620px] overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-soft dark:border-slate-800 dark:bg-slate-900 lg:grid-cols-[280px_1fr]">
                <aside class="border-b border-slate-200 bg-slate-50/80 p-5 dark:border-slate-800 dark:bg-slate-950/40 lg:border-b-0 lg:border-r"><div class="mb-5 flex items-center justify-between"><div><h2 class="font-semibold text-slate-900 dark:text-white">People here</h2><p class="mt-1 text-xs text-slate-500 dark:text-slate-400"><span id="user-count">0</span> online now</p></div><span class="grid h-9 w-9 place-items-center rounded-xl bg-brand-100 text-brand-600 dark:bg-brand-950/60 dark:text-brand-400">♧</span></div><ul id="users" class="flex gap-2 overflow-x-auto pb-1 lg:block lg:space-y-2"></ul></aside>
                <section class="flex min-w-0 flex-col"><div class="flex items-center justify-between border-b border-slate-200 px-5 py-4 sm:px-7 dark:border-slate-800"><div class="flex items-center gap-3"><div class="grid h-11 w-11 place-items-center rounded-2xl bg-gradient-to-br from-orange-100 to-brand-100 text-lg text-brand-600 dark:from-orange-950/60 dark:to-brand-950/60 dark:text-brand-400">☵</div><div><h2 class="font-semibold text-slate-900 dark:text-white">Main room</h2><p class="text-xs text-slate-500 dark:text-slate-400">A friendly place to chat</p></div></div><span id="mobile-connection" class="flex items-center gap-1.5 text-xs text-emerald-600 dark:text-emerald-400 sm:hidden"><span class="h-2 w-2 rounded-full bg-emerald-500"></span> Live</span></div><ul id="messages" aria-live="polite" class="flex-1 space-y-4 overflow-y-auto p-5 sm:p-7"></ul><form id="message-form" class="border-t border-slate-200 bg-slate-50/70 p-4 dark:border-slate-800 dark:bg-slate-950/30 sm:p-5"><div class="flex flex-col gap-2 sm:flex-row"><input id="to" type="text" placeholder="To (e.g. Barney)" required class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none ring-brand-500 transition placeholder:text-slate-400 focus:ring-2 dark:border-slate-700 dark:bg-slate-900 dark:text-white" /><div class="flex min-w-0 flex-1 gap-2"><input id="message" type="text" placeholder="Write a message..." autocomplete="off" required class="min-w-0 flex-1 rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none ring-brand-500 transition placeholder:text-slate-400 focus:ring-2 dark:border-slate-700 dark:bg-slate-900 dark:text-white" /><button type="submit" class="rounded-xl bg-gradient-to-r from-brand-600 to-orange-500 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-orange-500/20 transition hover:-translate-y-0.5 hover:shadow-orange-500/30 active:translate-y-0">Send</button></div></div></form></section>
            </div>
        </main>
    </div>
    <script>
        const username = {{printf "%q" .}}, messages = document.getElementById("messages"), users = document.getElementById("users"), connection = document.getElementById("connection"), mobileConnection = document.getElementById("mobile-connection"), themeIcon = document.getElementById("theme-icon");
        const socketProtocol = location.protocol === "https:" ? "wss" : "ws", socket = new WebSocket(`${socketProtocol}://${location.host}/room/ws`);
        function updateThemeIcon() { themeIcon.textContent = document.documentElement.classList.contains("dark") ? "☀" : "☾"; } updateThemeIcon();
        document.getElementById("theme-toggle").addEventListener("click", () => { const dark = document.documentElement.classList.toggle("dark"); localStorage.setItem("chat-theme", dark ? "dark" : "light"); updateThemeIcon(); });
        socket.onopen = () => { connection.classList.remove("hidden"); connection.classList.add("flex"); };
        socket.onmessage = ({ data }) => { const event = JSON.parse(data); if (event.type === "state") { event.messages.forEach(addMessage); renderUsers(event.users); } if (event.type === "message") addMessage(event.message); if (event.type === "users") renderUsers(event.users); };
        socket.onclose = () => { connection.className = "hidden"; mobileConnection.innerHTML = '<span class="h-2 w-2 rounded-full bg-red-500"></span> Offline'; mobileConnection.classList.replace("text-emerald-600", "text-red-600"); };
        function addMessage(message) { const item = document.createElement("li"), mine = message.from === username; item.className = `flex ${mine ? "justify-end" : "justify-start"}`; item.innerHTML = `<div class="max-w-[85%] rounded-2xl px-4 py-3 text-sm shadow-sm ${mine ? "rounded-br-md bg-gradient-to-br from-brand-600 to-orange-500 text-white" : "rounded-bl-md border border-slate-200 bg-slate-50 text-slate-700 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200"}"><p class="mb-1 text-[11px] font-medium ${mine ? "text-orange-100" : "text-slate-400 dark:text-slate-500"}></p><span></span></div>`; item.querySelector("p").textContent = `${message.from} → ${message.to}`; item.querySelector("span").textContent = message.message; messages.appendChild(item); messages.scrollTop = messages.scrollHeight; }
        function renderUsers(connected) { document.getElementById("user-count").textContent = connected.length; users.replaceChildren(...connected.map(name => { const item = document.createElement("li"); item.className = "flex min-w-max items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-slate-700 dark:text-slate-300"; item.innerHTML = '<span class="flex h-8 w-8 items-center justify-center rounded-full bg-gradient-to-br from-orange-100 to-brand-100 text-xs font-semibold text-brand-700 dark:from-orange-950/60 dark:to-brand-950/60 dark:text-brand-400"></span><span></span>'; item.querySelector("span:last-child").textContent = name; item.querySelector("span:first-child").textContent = name.charAt(0).toUpperCase(); return item; })); }
        document.getElementById("message-form").addEventListener("submit", event => { event.preventDefault(); const to = document.getElementById("to"), message = document.getElementById("message"); if (socket.readyState !== WebSocket.OPEN) return; socket.send(JSON.stringify({ type: "message", to: to.value.trim(), message: message.value.trim() })); message.value = ""; message.focus(); });
    </script>
</body>
</html>
