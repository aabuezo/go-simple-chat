<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Chat</title>
    <script>
        const savedTheme = localStorage.getItem("chat-theme");
        if (savedTheme === "dark" || (!savedTheme && window.matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: "class", theme: { extend: { colors: { brand: { 50: "#fff7ed", 100: "#ffedd5", 500: "#f97316", 600: "#ea580c", 700: "#c2410c" } }, boxShadow: { soft: "0 24px 70px rgba(15, 23, 42, .12)" } } } };</script>
</head>
<body class="h-screen overflow-hidden bg-slate-100 text-slate-800 antialiased transition-colors dark:bg-zinc-950 dark:text-zinc-100">
    <div class="flex h-screen min-h-0 flex-col bg-[radial-gradient(circle_at_top_right,_rgba(249,115,22,.13),_transparent_32rem)]">
        <header class="flex-none border-b border-slate-200/80 bg-white/80 backdrop-blur-xl dark:border-zinc-800 dark:bg-zinc-950/80">
            <div class="mx-auto flex w-[min(1180px,92%)] items-center justify-between py-5">
                <a href="/room" class="flex items-center gap-3"><span class="grid h-10 w-10 place-items-center rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 text-lg font-bold text-white shadow-lg shadow-orange-500/20">✦</span><span class="text-xl font-semibold tracking-tight text-slate-900 dark:text-white">Simple<span class="text-brand-600">Chat</span></span></a>
                <div class="flex items-center gap-2"><button id="theme-toggle" type="button" aria-label="Toggle color mode" class="grid h-10 w-10 place-items-center rounded-xl border border-slate-200 bg-white text-slate-600 transition hover:border-brand-300 hover:text-brand-600 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-300 dark:hover:border-brand-500 dark:hover:text-brand-400"><span id="theme-icon">☾</span></button><a href="/logout" class="rounded-xl px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-brand-600 dark:text-zinc-300 dark:hover:bg-zinc-800 dark:hover:text-brand-400">Log out</a></div>
            </div>
        </header>
        <main class="mx-auto flex min-h-0 w-[min(1180px,92%)] flex-1 flex-col py-4 sm:py-6">
            <div class="mb-6 flex items-end justify-between gap-4"><div><p class="mb-2 text-sm font-semibold uppercase tracking-[.2em] text-brand-600 dark:text-brand-500">Your space</p><h1 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white sm:text-4xl">Good to see you, {{.}}</h1><p class="mt-2 text-slate-500 dark:text-slate-400">Keep the conversation going.</p></div><div id="connection" class="hidden items-center gap-2 rounded-full border border-emerald-200 bg-emerald-50 px-3 py-1.5 text-xs font-medium text-emerald-700 dark:border-emerald-900/60 dark:bg-emerald-950/40 dark:text-emerald-400 sm:flex"><span class="h-2 w-2 rounded-full bg-emerald-500"></span> Connected</div></div>
            <div class="grid min-h-0 flex-1 overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-soft dark:border-zinc-800 dark:bg-zinc-900 lg:grid-cols-[280px_1fr]">
                <aside class="border-b border-slate-200 bg-slate-50/80 p-5 dark:border-zinc-800 dark:bg-zinc-950/60 lg:border-b-0 lg:border-r"><div class="mb-5 flex items-center justify-between"><div><h2 class="font-semibold text-slate-900 dark:text-white">People here</h2><p class="mt-1 text-xs text-slate-500 dark:text-zinc-400"><span id="user-count">0</span> online now</p></div><span class="grid h-9 w-9 place-items-center rounded-xl bg-brand-100 text-brand-600 dark:bg-zinc-800 dark:text-brand-400">♧</span></div><ul id="users" class="flex gap-2 overflow-x-auto pb-1 lg:block lg:space-y-2"></ul></aside>
                <section class="flex min-h-0 min-w-0 flex-col"><div class="flex flex-none items-center justify-between border-b border-slate-200 px-5 py-4 sm:px-7 dark:border-zinc-800"><div class="flex items-center gap-3"><div class="grid h-11 w-11 place-items-center rounded-2xl bg-gradient-to-br from-orange-100 to-brand-100 text-lg text-brand-600 dark:from-zinc-800 dark:to-zinc-700 dark:text-brand-400">☵</div><div><h2 class="font-semibold text-slate-900 dark:text-white">Main room</h2><p class="text-xs text-slate-500 dark:text-zinc-400">A friendly place to chat</p></div></div><span id="mobile-connection" class="flex items-center gap-1.5 text-xs text-emerald-600 dark:text-emerald-400 sm:hidden"><span class="h-2 w-2 rounded-full bg-emerald-500"></span> Live</span></div><ul id="messages" aria-live="polite" class="min-h-0 flex-1 space-y-4 overflow-y-auto p-5 sm:p-7"></ul><form id="message-form" class="flex-none border-t border-slate-200 bg-slate-50/70 p-4 dark:border-zinc-800 dark:bg-zinc-950/30 sm:p-5"><div class="flex flex-col gap-2 sm:flex-row"><button id="recipient" type="button" class="flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-3 text-left text-sm text-slate-500 outline-none transition hover:border-brand-300 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-400 sm:w-44"><span class="grid h-6 w-6 place-items-center rounded-full bg-brand-100 text-xs font-semibold text-brand-700 dark:bg-zinc-800 dark:text-brand-400">?</span><span class="min-w-0 truncate">Select a person</span></button><div class="flex min-w-0 flex-1 gap-2"><input id="message" type="text" placeholder="Write a message..." autocomplete="off" required class="min-w-0 flex-1 rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none ring-brand-500 transition placeholder:text-slate-400 focus:ring-2 dark:border-zinc-700 dark:bg-zinc-900 dark:text-white" /><button id="send" type="submit" class="rounded-xl bg-gradient-to-r from-brand-600 to-orange-500 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-orange-500/20 transition hover:-translate-y-0.5 hover:shadow-orange-500/30 active:translate-y-0 disabled:cursor-not-allowed disabled:opacity-50">Send</button></div></div></form></section>
            </div>
        </main>
    </div>
    <div id="toast" class="pointer-events-none fixed right-5 top-5 z-50 hidden max-w-sm rounded-2xl border border-orange-400 bg-gradient-to-r from-brand-600 to-orange-500 px-4 py-3 text-sm font-medium text-white shadow-xl shadow-orange-500/30"></div>
    <script>
        const username = {{printf "%q" .}}, messages = document.getElementById("messages"), users = document.getElementById("users"), connection = document.getElementById("connection"), mobileConnection = document.getElementById("mobile-connection"), themeIcon = document.getElementById("theme-icon"), recipient = document.getElementById("recipient"), send = document.getElementById("send");
        let selectedRecipient = "";
        const socketProtocol = location.protocol === "https:" ? "wss" : "ws", socket = new WebSocket(`${socketProtocol}://${location.host}/room/ws`);
        function updateThemeIcon() { themeIcon.textContent = document.documentElement.classList.contains("dark") ? "☀" : "☾"; } updateThemeIcon();
        document.getElementById("theme-toggle").addEventListener("click", () => { const dark = document.documentElement.classList.toggle("dark"); localStorage.setItem("chat-theme", dark ? "dark" : "light"); updateThemeIcon(); });
        socket.onopen = () => { connection.classList.remove("hidden"); connection.classList.add("flex"); };
        socket.onmessage = ({ data }) => { try { const event = JSON.parse(data), type = String(event.type || event.Type || "").toLowerCase(); if (type === "state") { renderContacts(event.contacts || event.Contacts || []); } else if (type === "history") { const chatWith = event.chatWith || event.ChatWith, history = event.messages || event.Messages || []; if (chatWith === selectedRecipient) { messages.replaceChildren(); (Array.isArray(history) ? history : []).forEach(renderChatMessage); } } else if (type === "message") { const payload = event.message || event.Message; if (payload) receiveMessage(payload); else console.error("Message event without payload", event); } else if (type === "contacts") renderContacts(event.contacts || event.Contacts || []); } catch (error) { console.error("Could not process chat event", error, data); } };
        socket.onclose = () => { connection.className = "hidden"; mobileConnection.innerHTML = '<span class="h-2 w-2 rounded-full bg-red-500"></span> Offline'; mobileConnection.classList.replace("text-emerald-600", "text-red-600"); };
        function addMessage(message) { const item = document.createElement("li"), mine = message.from === username; item.className = `flex ${mine ? "justify-end" : "justify-start"}`; item.innerHTML = `<div class="max-w-[85%] rounded-2xl px-4 py-3 text-sm shadow-sm ${mine ? "rounded-br-md bg-gradient-to-br from-brand-600 to-orange-500 text-white" : "rounded-bl-md border border-slate-200 bg-slate-50 text-slate-700 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200"}"><p class="mb-1 text-[11px] font-medium ${mine ? "text-orange-100" : "text-slate-400 dark:text-slate-500"}></p><span></span></div>`; item.querySelector("p").textContent = `${message.from} → ${message.to}`; item.querySelector("span").textContent = message.message; messages.appendChild(item); messages.scrollTop = messages.scrollHeight; }
        function addMessage(message) { const from = message.from || message.From, to = message.to || message.To, text = message.message || message.Message; if (!from || !to) { console.error("Invalid chat message", message); return; } const item = document.createElement("li"), mine = from === username; item.className = `flex ${mine ? "justify-end" : "justify-start"}`; item.innerHTML = `<div class="max-w-[85%] rounded-2xl px-4 py-3 text-sm shadow-sm ${mine ? "rounded-br-md bg-gradient-to-br from-brand-600 to-orange-500 text-white" : "rounded-bl-md border border-slate-200 bg-slate-50 text-slate-700 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200"}"><p class="mb-1 text-[11px] font-medium ${mine ? "text-orange-100" : "text-slate-400 dark:text-slate-500"}"></p><span></span></div>`; item.querySelector("p").textContent = `${from} → ${to}`; item.querySelector("span").textContent = text; messages.appendChild(item); messages.scrollTop = messages.scrollHeight; }
        function renderChatMessage(message) { const from = String(message.from || message.From || "").trim(), to = String(message.to || message.To || "").trim(), text = message.message || message.Message || "", mine = message.mine === true || message.Mine === true; if (!from || !to) return; const item = document.createElement("li"); item.className = `flex w-full ${mine ? "justify-end" : "justify-start"}`; const bubble = document.createElement("div"); bubble.className = mine ? "max-w-[85%] rounded-2xl rounded-br-md bg-gradient-to-br from-orange-500 to-amber-500 px-4 py-3 text-sm text-white shadow-md shadow-orange-500/10" : "max-w-[85%] rounded-2xl rounded-bl-md border border-slate-200 bg-slate-100 px-4 py-3 text-sm text-slate-700 shadow-sm dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-200"; const meta = document.createElement("p"); meta.className = mine ? "mb-1 text-[11px] font-medium text-orange-100" : "mb-1 text-[11px] font-medium text-slate-400 dark:text-zinc-500"; meta.textContent = mine ? "Me" : from; const content = document.createElement("span"); content.textContent = text; bubble.append(meta, content); item.appendChild(bubble); messages.appendChild(item); messages.scrollTop = messages.scrollHeight; }
        const unread = new Map(), toast = document.getElementById("toast");
        function receiveMessage(message) { const from = message.from || message.From, to = message.to || message.To, mine = message.mine === true || message.Mine === true, conversationPartner = mine ? to : from; if (conversationPartner === selectedRecipient) renderChatMessage(message); else if (!mine) { unread.set(from, (unread.get(from) || 0) + 1); renderContacts(lastContacts); showToast(`New message from ${from}`); } }
        let lastContacts = [];
        function openChat(name) { if (!name || name === username) return; selectedRecipient = name; unread.delete(name); messages.replaceChildren(); selectRecipient(name); renderContacts(lastContacts); if (socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: "history", to: name })); }
        function showToast(text) { toast.textContent = text; toast.classList.remove("hidden"); clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.classList.add("hidden"), 4000); }
        function renderContacts(contacts) { lastContacts = Array.isArray(contacts) ? contacts : []; const others = lastContacts.filter(contact => contact.username !== username); document.getElementById("user-count").textContent = lastContacts.filter(contact => contact.online).length; users.replaceChildren(...lastContacts.map(contact => { const item = document.createElement("li"), selected = contact.username === selectedRecipient, count = unread.get(contact.username) || 0; item.className = `flex min-w-max cursor-pointer items-center gap-3 rounded-xl px-3 py-2.5 text-sm transition ${selected ? "bg-white text-brand-600 shadow-sm dark:bg-zinc-800 dark:text-brand-400" : "text-slate-700 hover:bg-white hover:text-brand-600 dark:text-zinc-300 dark:hover:bg-zinc-800"}`; item.innerHTML = `<span class="relative flex h-8 w-8 items-center justify-center rounded-full bg-gradient-to-br from-orange-100 to-brand-100 text-xs font-semibold text-brand-700 dark:from-zinc-800 dark:to-zinc-700 dark:text-brand-400">${contact.username.charAt(0).toUpperCase()}<i class="absolute bottom-0 right-0 h-2.5 w-2.5 rounded-full border-2 border-slate-50 ${contact.online ? "bg-emerald-500" : "bg-slate-300 dark:border-zinc-950 dark:bg-zinc-600"}"></i></span><span class="min-w-0 flex-1 truncate">${contact.username}</span>${count ? `<b class="grid h-5 min-w-5 place-items-center rounded-full bg-brand-600 px-1 text-[10px] text-white">${count}</b>` : ""}`; item.addEventListener("click", () => openChat(contact.username)); return item; })); if (!selectedRecipient && others.length) openChat(others[0].username); }
        function selectRecipient(name) { selectedRecipient = name; recipient.querySelector("span:last-child").textContent = name; recipient.querySelector("span:first-child").textContent = name.charAt(0).toUpperCase(); recipient.classList.add("border-brand-300", "text-slate-700", "dark:border-brand-500", "dark:text-zinc-200"); send.disabled = false; }
        function renderUsers(connected) { document.getElementById("user-count").textContent = connected.length; if (!selectedRecipient || !connected.includes(selectedRecipient)) { selectedRecipient = connected.find(name => name !== username) || ""; } users.replaceChildren(...connected.map(name => { const item = document.createElement("li"); item.setAttribute("aria-pressed", name === selectedRecipient); item.className = `flex min-w-max cursor-pointer items-center gap-3 rounded-xl px-3 py-2.5 text-sm transition hover:bg-white hover:text-brand-600 dark:text-zinc-300 dark:hover:bg-zinc-800 ${name === selectedRecipient ? "bg-white text-brand-600 shadow-sm dark:bg-zinc-800 dark:text-brand-400" : "text-slate-700"}`; item.innerHTML = '<span class="flex h-8 w-8 items-center justify-center rounded-full bg-gradient-to-br from-orange-100 to-brand-100 text-xs font-semibold text-brand-700 dark:from-zinc-800 dark:to-zinc-700 dark:text-brand-400"></span><span></span>'; item.querySelector("span:last-child").textContent = name; item.querySelector("span:first-child").textContent = name.charAt(0).toUpperCase(); item.addEventListener("click", () => { if (name !== username) { selectRecipient(name); renderUsers(connected); } }); return item; })); if (selectedRecipient) selectRecipient(selectedRecipient); else { recipient.querySelector("span:last-child").textContent = "Waiting for another user"; send.disabled = true; } }
        recipient.addEventListener("click", () => { const firstOther = [...users.querySelectorAll("li")].find(item => item.textContent !== username); if (firstOther) firstOther.click(); });
        document.getElementById("message-form").addEventListener("submit", event => { event.preventDefault(); const message = document.getElementById("message"); if (socket.readyState !== WebSocket.OPEN || !selectedRecipient) return; socket.send(JSON.stringify({ type: "message", to: selectedRecipient, message: message.value.trim() })); message.value = ""; message.focus(); });
    </script>
</body>
</html>
